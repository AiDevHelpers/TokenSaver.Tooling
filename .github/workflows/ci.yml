name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Recurse -Filter *.csproj
          if (-not $projects) { Write-Host "No .csproj files; nothing to build."; exit 0 }
          foreach ($p in $projects) { dotnet build $p.FullName --configuration Release; if ($LASTEXITCODE -ne 0) { exit 1 } }
          $tests = $projects | Where-Object { $_.Name -like '*Tests.csproj' }
          foreach ($t in $tests) { dotnet test $t.FullName --configuration Release --no-build; if ($LASTEXITCODE -ne 0) { exit 1 } }
